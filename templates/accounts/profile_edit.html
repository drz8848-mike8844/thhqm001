{% extends 'base.html' %}
{% block title %}编辑资料 · 东方幻绮梦{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h3 class="mb-4"><i class="bi bi-pencil-square text-primary"></i> 编辑个人资料</h3>
        <div class="card p-4">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">昵称</label>
                    <input type="text" name="nickname" class="form-control" value="{{ form.nickname.value|default:user.profile.nickname }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">头像</label>
                    <input type="file" name="avatar" class="form-control" accept="image/*">
                    {% if user.profile.avatar %}<div class="form-text">当前头像：<img src="{{ user.profile.avatar.url }}" class="avatar avatar-sm mt-1"></div>{% endif %}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">个人简介</label>
                    <textarea name="bio" class="form-control" rows="3" placeholder="介绍一下自己吧~">{{ form.bio.value|default:user.profile.bio }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">邮箱地址</label>
                    <input type="email" name="email" class="form-control" value="{{ form.email.value|default:user.email }}" required>
                    <div class="form-text">修改邮箱后需要重新验证</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">密保问题</label>
                    <input type="text" name="security_question" class="form-control" value="{{ form.security_question.value|default:user.profile.security_question }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">密保答案</label>
                    <input type="text" name="security_answer" class="form-control" value="{{ form.security_answer.value|default:user.profile.security_answer }}">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-brand" type="submit"><i class="bi bi-check-lg"></i> 保存修改</button>
                    <a href="{% url 'profile' %}" class="btn btn-outline-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
