{% extends 'base.html' %}
{% block title %}登录 · 东方幻绮梦{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-4">
            <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right text-primary"></i> 登录</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-control" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                {% if form.errors %}<div class="alert alert-danger py-2">用户名或密码错误</div>{% endif %}
                <button class="btn btn-brand w-100 mb-3" type="submit"><i class="bi bi-box-arrow-in-right"></i> 登录</button>
            </form>
            <div class="text-center small">
                <a href="{% url 'password_reset_request' %}" class="d-block mb-1">忘记密码？</a>
                <a href="{% url 'reset_password' %}" class="d-block mb-1">密保问题重置</a>
                <a href="{% url 'register' %}">没有账号？去注册 →</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
