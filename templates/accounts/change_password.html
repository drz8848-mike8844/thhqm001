{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}修改密码 · 东方幻绮梦{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-4">
            <h3 class="mb-4"><i class="bi bi-key text-primary"></i> 修改密码</h3>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex gap-2 mt-3">
                    <button class="btn btn-brand" type="submit"><i class="bi bi-check-lg"></i> 确认修改</button>
                    <a href="{% url 'profile' %}" class="btn btn-outline-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
