{% extends 'base.html' %}
{% block title %}设置新密码 · 东方幻绮梦{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-4">
            <h3 class="mb-3"><i class="bi bi-shield-lock text-primary"></i> 设置新密码</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label class="form-label">新密码</label><input type="password" name="password" class="form-control" required minlength="6"></div>
                <div class="mb-3"><label class="form-label">确认新密码</label><input type="password" name="password_confirm" class="form-control" required></div>
                <button class="btn btn-brand w-100" type="submit"><i class="bi bi-check-lg"></i> 重置密码</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
