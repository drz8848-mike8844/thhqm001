{% extends 'base.html' %}
{% block title %}重置密码 · 东方幻绮梦{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-4">
            <h3 class="mb-3"><i class="bi bi-envelope-paper text-primary"></i> 邮箱重置密码</h3>
            <p class="text-muted">请输入您的邮箱地址，我们将向您发送密码重置链接。</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label class="form-label">邮箱地址</label><input type="email" name="email" class="form-control" placeholder="请输入注册时使用的邮箱" required></div>
                <button class="btn btn-brand w-100" type="submit"><i class="bi bi-send"></i> 发送重置邮件</button>
            </form>
            <div class="text-center small mt-3"><a href="{% url 'login' %}">返回登录</a></div>
        </div>
    </div>
</div>
{% endblock %}
