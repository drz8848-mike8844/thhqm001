{% extends 'base.html' %}
{% block title %}密保重置密码 · 东方幻绮梦{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-4">
            <h3 class="mb-3"><i class="bi bi-shield-check text-primary"></i> 密保重置密码</h3>
            {% if not question %}
            <form method="get">
                <div class="mb-3"><label class="form-label">输入用户名以获取密保问题</label><input type="text" name="username" class="form-control" required></div>
                <button class="btn btn-outline-primary" type="submit">下一步</button>
            </form>
            {% else %}
            <div class="alert alert-info">问题：{{ question }}</div>
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="username" value="{{ request.GET.username }}">
                <div class="mb-3"><label class="form-label">密保答案</label><input type="text" name="answer" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">新密码</label><input type="password" name="new_password" class="form-control" required></div>
                <button class="btn btn-brand" type="submit">确认重置</button>
            </form>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
